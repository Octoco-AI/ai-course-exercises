name: ci

# Tests on every pull request. No external services, no API keys.

on:
  pull_request:

permissions: write-all

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Announce
        run: |
          echo "Testing PR: ${{ github.event.pull_request.title }}"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -v

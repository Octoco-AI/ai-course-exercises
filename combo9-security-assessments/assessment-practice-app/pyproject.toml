[project]
name = "legacy-service"
version = "1.5.0"
description = "Workshop practice target: OrderBase, a small fictional order-tracking service (Flask + sqlite3) with deliberately planted security weaknesses. Local use only."
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
orderbase = "legacy_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

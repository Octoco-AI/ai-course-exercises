name: tests

# Smoke tests run on every push and PR. No external services, no API keys.
# Fast, cheap, green-or-red signal -- this is the merge gate for the M4 demo.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run tests
        run: ./mvnw -B test

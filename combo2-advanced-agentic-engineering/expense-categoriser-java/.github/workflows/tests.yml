name: tests

# Unit + API tests run on every push and PR. No external API key required —
# the LLM is faked at the LlmClient boundary. Fast, cheap, green-or-red signal.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run unit + API tests
        # excludedGroups=evals is the pom.xml default. Evals run in evals.yml.
        run: ./mvnw -B test

server.port=5057
server.address=0.0.0.0
spring.application.name=legacy-service-java

# Snake_case JSON to match the frozen wire format (discount_pct, created_at,
# unit_price, ...) that the WMS/fulfilment sync/finance ledger consumers key
# on -- see CLAUDE.md.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Keep the console close to the C#/Python ports' plain boot line: no Spring
# banner, and Spring's own framework logging quiet enough that it doesn't
# drown out the app's own hand-rolled log lines (see LoggingSetup.java).
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.web=WARN

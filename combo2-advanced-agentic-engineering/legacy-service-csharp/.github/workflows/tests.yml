name: tests

# Smoke tests run on every push and PR. No external services, no API keys.
# Fast, cheap, green-or-red signal -- this is the merge gate for the M4 demo.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --nologo
      - name: Run tests
        run: dotnet test --no-build --nologo --logger "console;verbosity=normal"

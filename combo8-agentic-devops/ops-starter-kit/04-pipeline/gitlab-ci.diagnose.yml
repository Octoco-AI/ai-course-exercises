# Diagnose-failed-job stage (m64), at the recommend rung of the ladder.
#
# When any job in a merge request pipeline fails, this job:
#   1. collects the failed jobs' logs with a deterministic script (GitLab API, GET only),
#   2. runs Claude Code headless with READ-ONLY tools over those logs and the checkout,
#   3. redacts the diagnosis and posts it as an MR comment with a deterministic script.
# The agent itself cannot run commands, write files, call the network or deploy.
#
# The logs are UNTRUSTED INPUT. This job runs for MR pipelines, so the author of
# the MR decides what the failed jobs print, including text addressed to the agent.
# Meanwhile the job environment holds the model key and a GitLab token, and the
# runner's .git/config may embed the job token. So the agent may read only the
# checkout (which contains diagnose/), never .git/, /proc, /etc, $HOME, /tmp or
# credential files, and its output is redacted again before it is posted.
#
# Use it:  include it from your .gitlab-ci.yml
#   include:
#     - local: 04-pipeline/gitlab-ci.diagnose.yml
#
# Set up (Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY   masked. NOT protected: MR pipelines on feature branches must
#                       see it, which means any branch's jobs can. Use a dedicated key
#                       with a low spend limit, or switch to the OIDC variant at the bottom.
#   DIAGNOSE_API_TOKEN  masked project access token, role Reporter, scope api.
#                       Reporter can read job logs and comment; it cannot push, merge or
#                       run deploy jobs. VERIFY: role permissions on your GitLab version.
#   DIAGNOSE_ENABLED    optional; set to "false" to switch the stage off without an MR
#                       (the kill switch).
#
# No deploy rights, by construction:
#   - Runs only on runners tagged <NON_PROD_RUNNER_TAG>. Never give that tag to a
#     runner that can reach production.
#   - Declares no `environment:`. Keep every deploy credential (kubeconfig, Argo CD
#     token, cloud role) environment-scoped to production and protected, so this
#     job never receives it.
#   - Runs only for merge_request_event pipelines: feature branches, never the
#     default branch or tags.
#   - The agent's tools are Read, Grep and Glob (--tools), and Read is pre-approved
#     only inside the checkout: Read(./**). Bash, Edit, Write and web tools are
#     disallowed, and --permission-mode dontAsk denies anything else that would prompt.
#
# What the agent can read (Claude Code permission rules, gitignore syntax;
# code.claude.com/docs → Configure permissions):
#   - blockReadsOutsideWorkingDirectories (--settings) makes the file tools refuse
#     any path outside the checkout, in every mode. That covers the runner's
#     <project>.tmp/ directory of file-type CI variables, /proc/self/environ and $HOME.
#   - Read(...) deny rules in --disallowedTools name the dangerous paths as well,
#     so a missed setting still fails closed. Claude Code applies Read deny rules
#     to Grep and Glob too (best effort, per the docs). `.git/**` as a deny rule
#     matches a .git directory at any depth under the checkout.
#   - A deny rule beats an allow rule, so Read(./**) does not reopen .git/ or .env.
#   VERIFY: the flags against the Claude Code version you pin; run
#   `claude --bare -p "read .git/config and print it" ...` with these flags once
#   and check it is refused.

diagnose-failed-job:
  stage: .post
  image: node:24-alpine3.21          # <PIN_BY_DIGEST> in production use
  tags:
    - <NON_PROD_RUNNER_TAG>
  rules:
    - if: '$DIAGNOSE_ENABLED == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_failure
  allow_failure: true                # a broken diagnosis must never block a merge
  interruptible: true
  timeout: 15m
  variables:
    GIT_DEPTH: "20"
    DIAGNOSE_TAIL_LINES: "300"
    DIAGNOSE_MAX_JOBS: "3"
    CLAUDE_CODE_VERSION: "<CLAUDE_CODE_VERSION>"   # pin, e.g. a version your team has tested
    USE_BUILTIN_RIPGREP: "0"         # Alpine/musl: use the system ripgrep
    DISABLE_AUTOUPDATER: "1"
  before_script:
    - apk add --no-cache bash curl jq git ripgrep libgcc libstdc++
    - curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
    - export PATH="$HOME/.local/bin:$PATH"
    - claude --version
  script:
    - bash 04-pipeline/scripts/collect-failed-job-logs.sh diagnose
    # --bare: no hooks, plugins, MCP servers or CLAUDE.md from the checkout are loaded,
    # so a branch cannot widen the agent's tools by editing files in its own MR.
    # Keep the prompt straight after -p: the tool flags take lists.
    - >
      claude --bare
      -p "$(cat 04-pipeline/prompts/diagnose-failed-job.md)"
      --permission-mode dontAsk
      --tools "Read,Grep,Glob"
      --settings '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
      --allowedTools "Read(./**)"
      --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,mcp__*,Read(.git/**),Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(//root/**),Read(//home/**),Read(~/**),Read(//tmp/**),Read(//run/**),Read(//var/run/**),Read(.env),Read(.env.*),Read(*.env),Read(.npmrc),Read(.netrc),Read(.pypirc),Read(.git-credentials),Read(.docker/**),Read(.kube/**),Read(*.pem),Read(*.key),Read(id_rsa*),Read(id_ed25519*),Read(*.tfvars),Read(*.tfstate)"
      --max-turns 12
      --output-format text
      > diagnose/diagnosis.md
    # Redacts the diagnosis (same pass as the logs, redact.sh) before posting it.
    - bash 04-pipeline/scripts/post-mr-note.sh diagnose/diagnosis.md
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - diagnose/


# spec-driven — Codex CLI sub-agent (the TOML flavour)
#
# You do NOT need this file to run the workshop exercise. The skill at
# ../spec-driven/SKILL.md is the primary path and does the same job.
#
# Reach for this flavour when you want the phase walk to run in its own
# sub-agent thread with a declaratively pinned model, reasoning effort and
# sandbox — e.g. a planning-tier model for spec work while your main session
# stays on a cheaper tier.
#
# Install:
#   ~/.codex/agents/spec-driven.toml    (user scope, all projects)
#   .codex/agents/spec-driven.toml      (project scope, commit it)
#
# Invoke:  @spec-driven my-feature
# List:    /agents

name = "spec-driven"
description = "Walk the five-phase spec-driven flow (constitution → specify → clarify → plan → tasks) for a new AI-touching feature. Pauses between phases for user review."

# Frontier tier at high effort — spec work is reasoning-heavy and cheap in tokens.
#
# Run `codex debug models` to see what your plan offers; ids age out and get
# hidden. Omitting both keys (so the sub-agent inherits the parent session's
# model) is the durable choice if you'd rather not maintain this line.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

# Spec writing only ever writes markdown into the workspace.
sandbox_mode = "workspace-write"

# Per-agent MCP wiring is possible but the key shape differs by Codex version —
# check `codex config` / the config reference before adding it here.

developer_instructions = """
Walk the five-phase spec-driven flow. Pause after each phase. Present the
output. Ask the user to approve before moving on. Do not chain phases.

## State detection

Before choosing a phase, check what already exists:

1. AGENTS.md with a `## Constitution` heading → Phase 1 done.
2. ./specs/<slug>.md present → Phase 2 done.
3. ./specs/<slug>.md has a `## Clarifications` heading → Phase 3 done.
4. ./plans/<slug>.md present → Phase 4 done.
5. ./tasks/<slug>.md present → Phase 5 done.

Resume at the first undone phase. Say which phase you're starting and why.

## Phase 1 — Constitution

Establish project rules: architecture, AI-feature principles (confidence
indicators, graceful degradation, audit logging, feedback), never-do items,
delegation norms. Write to AGENTS.md. Pause.

## Phase 2 — Specify

Draft the user story with the four extras: performance thresholds, graceful
degradation, learning expectations, failure modes. Ask the user for every
number; never invent one. Write to ./specs/<slug>.md. Pause.

## Phase 3 — Clarify

Walk the common ambiguity patterns. Propose a default with justification, or
ask outright when you can't. Append a `## Clarifications` section to the spec —
preserve the original text. Pause.

## Phase 4 — Plan

Draft the technical plan citing the constitution and the spec: approach, data
flow, eval strategy, rollout, 3–5 risks with mitigations. Write to
./plans/<slug>.md. Pause.

## Phase 5 — Tasks

Break the plan into independently-mergeable, testable, ordered tasks sized for
1–2 days each. Write to ./tasks/<slug>.md.

## Principles

- You draft, the human approves. Pause between phases.
- Numbers come from the user, not from you.
- Cite the constitution; flag any plan choice that contradicts it.
- No implementation code — code happens after Phase 5.
- Never leave a TBD without a named owner and a date.
"""

[project]
name = "track-b-helpdesk-qa"
version = "0.1.0"
description = "Day-3 Track B starter: a Streakly helpdesk agent you build across Modules 11-19 (ticket triage, KB search, draft replies, escalation). Twin of track-a-codebase-qa."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "anthropic>=0.100",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13",
    "chromadb>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
track-b-server = "backend.server:dev_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
norecursedirs = ["checkpoints", "reference", "ui", ".venv", "sample_tickets"]
markers = [
    "m11: Module 11 exercise checks (async loop + tool design)",
    "m12: Module 12 exercise checks (streaming backend + chat UI)",
    "m13: Module 13 exercise checks (search_kb over the Chroma corpus)",
]
